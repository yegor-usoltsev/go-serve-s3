---
name: CI

on:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7 # zizmor: ignore[cache-poisoning] goreleaser only runs `check` here; release.yml builds without the cache
        with:
          go-version-file: go.mod
      - run: go test -v -race -timeout=100s -covermode=atomic -coverprofile=coverage.txt ./...
      - uses: j178/prek-action@v3.0.1
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: check
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
